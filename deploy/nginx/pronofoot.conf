# PronoFoot — virtual host Nginx.
# Copier vers /etc/nginx/sites-available/pronofoot, lier dans sites-enabled, remplacer pronofoot.example.com
# et le socket PHP-FPM, puis : nginx -t && systemctl reload nginx.
# Certificat : certbot --nginx -d pronofoot.example.com (renouvellement : certbot renew --dry-run).

server {
    listen 80;
    listen [::]:80;
    server_name pronofoot.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pronofoot/backend/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pronofoot.example.com;

    # Racine : backend/public uniquement, jamais la racine du dépôt.
    root /var/www/pronofoot/backend/public;
    index index.php;
    charset utf-8;
    client_max_body_size 2m;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pronofoot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pronofoot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/pronofoot.access.log;
    error_log /var/log/nginx/pronofoot.error.log warn;

    # Les en-têtes de sécurité (CSP, X-Frame-Options, HSTS en HTTPS...) sont ajoutés par l'application.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /admin-assets/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        try_files $uri =404;
    }

    # Interdit les fichiers cachés (.env, .git...) et le fichier hot de développement Vite.
    location ~ /\.(?!well-known).* { deny all; }
    location = /admin-assets/hot { deny all; }
}
