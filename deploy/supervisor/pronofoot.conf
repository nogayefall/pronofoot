; PronoFoot — Supervisor. Copier vers /etc/supervisor/conf.d/pronofoot.conf, adapter user et chemins, puis :
;   supervisorctl reread && supervisorctl update && supervisorctl status
; Un seul processus scan:run (numprocs=1) pour éviter des passages concurrents.

[program:pronofoot-scan]
directory=/var/www/pronofoot/backend
; --max-memory : au-delà, arrêt propre et relance automatique par Supervisor.
command=/usr/bin/php artisan scan:run --max-memory=256 --error-backoff=5
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
; SIGTERM : scan:run termine le passage en cours puis s'arrête proprement.
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/pronofoot/backend/storage/logs/scan-supervisor.log
stderr_logfile=/var/www/pronofoot/backend/storage/logs/scan-supervisor-error.log

[program:pronofoot-queue]
directory=/var/www/pronofoot/backend
; Envoi des alertes et des alertes de quota. --max-time relance le worker toutes les heures.
command=/usr/bin/php artisan queue:work database --tries=3 --timeout=90 --sleep=1 --max-time=3600 --memory=256
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=100
stopasgroup=true
killasgroup=true
stdout_logfile=/var/www/pronofoot/backend/storage/logs/queue-supervisor.log
stderr_logfile=/var/www/pronofoot/backend/storage/logs/queue-supervisor-error.log
